[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "benma-api"
version = "0.1.0"
description = "Truth-preserving Benma production API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "anyio>=4.4,<5",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "phonenumbers>=9.0,<10",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "pypinyin>=0.55,<1",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0.41,<3",
  "uvicorn[standard]>=0.35,<1",
  "websockets>=15,<18",
]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/benma_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/benma_api/api/routes.py" = ["B008"]
"src/benma_api/auth/service.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/benma_api"]
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = ["phonenumbers.*", "pypinyin.*"]
ignore_missing_imports = true

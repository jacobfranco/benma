services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: benma
      POSTGRES_USER: benma
      POSTGRES_PASSWORD: benma
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benma -d benma"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - benma-postgres:/var/lib/postgresql/data

volumes:
  benma-postgres:

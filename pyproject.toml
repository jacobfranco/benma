[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "benma-benchmark"
version = "0.1.0"
description = "Truth-preserving Mandarin speech evaluation research harness"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary research code" }
dependencies = ["pydantic>=2.12,<3"]

[project.optional-dependencies]
live = ["httpx>=0.28,<1", "websockets>=15,<17"]
acoustics = [
  "numpy>=2.1,<3",
  "praat-parselmouth>=0.4.6,<0.6",
  "torch>=2.6,<3",
  "torchcrepe>=0.0.23,<0.1",
]
dev = ["mypy>=1.17,<2", "pytest>=8.4,<10", "ruff>=0.12,<1"]

[project.scripts]
benma-benchmark = "benchmark.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["benchmark/reports/outputs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["benchmark"]
exclude = ["benchmark/reports/outputs"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["parselmouth.*", "torch.*", "torchcrepe.*"]
ignore_missing_imports = true

